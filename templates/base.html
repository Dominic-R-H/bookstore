<!DOCTYPE html>
<html>

<head>
    <title>{% block title %}Bookstore{% endblock %}</title>

    <meta name="description"
        content="Browse and buy books online across categories like kids, fiction, classics, novels, comics and more">
    <meta name="keywords"
        content="books, bookstore, buy books online, junior books buy, fiction, kids books, infants books, Novels books, Comic books, Thriller books">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="index, follow">

    <!-- CSS files -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    {% block css %} {% endblock %}

</head>

<body>

    <header>

        <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-4">

            <!-- Bookstore Logo -->
            <a class="navbar-brand fw-bold" href="/">Bookstore</a>

            <!-- Show button when on mobile screen -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-content">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navbar content -->
            <div class="collapse navbar-collapse justify-content-end" id="navbar-content">
                <ul class="navbar-nav align-items-center">
                    <!-- User is logged in. Just show an avatar -->
                    {% if logged_in %}
                    <li class="nav-item">
                        <!-- logout request button -->
                        <form method="POST" action="/logout" class="d-inline">
                            <button type="submit" class="btn btn-dark ms-2">Logout</button>
                        </form>
                    </li>
                    {% else %}
                    <!-- User is not logged in. Show register and login buttons -->
                    <li class="nav-item">
                        <a class="nav-link" href="/login">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-dark ms-2" href="/register">Register</a>
                    </li>
                    {% endif %}
                </ul>
            </div>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>


    <footer> </footer>

    <!-- Javascript files -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block javascript %}{% endblock %}


</body>

</html>
